[tools]
bun = "1.4.2"
actionlint = "1.7.12"
shellcheck = "0.11.0"
fnox = "1.30.0"
openbao = "2.5.4"

[tasks.install]
description = "Install locked project dependencies"
run = "bun install --frozen-lockfile"

[tasks.check]
description = "Type-check shared modules and local scripts"
run = "bun run check"

[tasks.test]
description = "Run offline S3 integration tests"
run = "bun test"

[tasks.verify]
description = "Run Bun type checks, tests, and workflow linting"
depends = ["check", "test", "lint:ci"]

[tasks."lint:ci"]
description = "Validate GitHub Actions workflows"
run = "actionlint"

[tasks."wmill:pull"]
description = "Pull from the currently selected Windmill workspace"
run = "bun run --bun wmill sync pull"

[tasks."wmill:push"]
description = "Preview and push to the currently selected Windmill workspace"
run = "bun run --bun wmill sync push --auto-metadata --keep-deleted"

[tasks."pi:login"]
description = "Log in to Codex using pi OAuth; save a gitignored credentials file"
run = "bun run scripts/pi-login.ts"

[tasks."equity:local"]
description = "Send equity quotes and a short opinion to Telegram using local env credentials"
run = "bun run scripts/equity-local.ts"

[tasks."wmill:bao"]
description = "Run Windmill CLI with WM_TOKEN injected from OpenBao by fnox"
dir = "{{config_root}}"
env.BAO_ADDR = "https://bao.nokiy.net"
run = 'PATH="$PWD/scripts/openbao-bin:$PATH" fnox --no-daemon -c fnox.toml exec -- bun run --bun wmill'

[tasks."bao:login"]
description = "Log in to OpenBao via Pocket ID without printing the token"
env.BAO_ADDR = "https://bao.nokiy.net"
run = "bao login -no-print -method=oidc -path=oidc role=openbao-operator callbackmode=device skip_browser=true show_qr=false"

[tasks."blob:local"]
description = "Read or roundtrip blobs using automatic local/Windmill configuration"
run = "bun run scripts/blob-local.ts"

[tasks."blob:debug"]
description = "Debug the unified blob interface locally"
run = "bun --inspect-wait run scripts/blob-local.ts"
