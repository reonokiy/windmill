[tools]
bun = "1.4.2"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[tasks.install]
description = "Install locked project dependencies"
run = "bun install --frozen-lockfile"

[tasks.check]
description = "Type-check shared modules and local scripts"
run = "bun run check"

[tasks.test]
description = "Run offline S3 integration tests"
run = "bun test"

[tasks.verify]
description = "Run Bun type checks, tests, and workflow linting"
depends = ["check", "test", "lint:ci"]

[tasks."lint:ci"]
description = "Validate GitHub Actions workflows"
run = "actionlint"

[tasks."b2:local"]
description = "Read an object locally: mise run b2:local -- read KEY"
run = "bun run scripts/b2-local.ts"

[tasks."b2:debug"]
description = "Start Bun debugger: mise run b2:debug -- read KEY"
run = "bun --inspect-wait run scripts/b2-local.ts"

[tasks."wmill:pull"]
description = "Pull from the currently selected Windmill workspace"
run = "bun run --bun wmill sync pull"

[tasks."wmill:push"]
description = "Preview and push to the currently selected Windmill workspace"
run = "bun run --bun wmill sync push --auto-metadata --keep-deleted"

[tasks."wmill:test"]
description = "Run the B2 roundtrip test on the Windmill worker"
run = "bun run --bun wmill script run f/storage-test/roundtrip --data '{}'"
