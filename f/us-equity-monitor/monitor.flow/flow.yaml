summary: Send US equity quotes and a short opinion to Telegram
description: Every run sends quotes and a brief Chinese opinion in one Telegram message.
value:
  modules:
    - id: research
      value:
        type: script
        input_transforms:
          horizon:
            type: javascript
            expr: flow_input.horizon
          model:
            type: javascript
            expr: flow_input.model
          provider:
            type: javascript
            expr: flow_input.provider
          symbols:
            type: javascript
            expr: flow_input.symbols
        path: f/us-equity-monitor/analyze
      timeout:
        type: static
        value: 660
schema:
  type: object
  properties:
    horizon:
      type: string
      default: 未来几天到几周
    model:
      type: string
      default: gpt-6-luna
    provider:
      type: string
      default: codex-gateway
    symbols:
      type: array
      default:
        - SPY
        - QQQ
        - AAPL
        - MSFT
        - NVDA
        - AMZN
        - GOOGL
        - META
        - TSLA
      items:
        type: string
  required: []
